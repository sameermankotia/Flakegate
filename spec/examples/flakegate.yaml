version: 1
provider: openai
model: gpt-4o-mini
api_key_env: OPENROUTER_API_KEY
concurrency: 5

cases:
  - id: refund-policy-qa
    prompt: "What is our refund policy for orders older than 30 days?"
    params:
      temperature: 0.7
      max_tokens: 300
    repeat: 10
    threshold: 0.8
    normalize:
      mode: exact
      case_insensitive: true
      collapse_whitespace: true

  - id: order-status-classification
    prompt: |
      Classify this support ticket into exactly one label: SHIPPING, BILLING, or ACCOUNT.
      Respond with only the label.
      Ticket: "My card was charged twice for the same order."
    params:
      temperature: 0.2
      max_tokens: 10
    repeat: 8
    threshold: 0.95
    normalize:
      mode: exact
      case_insensitive: true
      collapse_whitespace: true
