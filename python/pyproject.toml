[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flakegate"
version = "0.1.0"
description = "A reliability gate for LLM calls in CI — run a prompt k times, score output consistency, fail the build if it drops below threshold."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Sameer Mankotia" }]
requires-python = ">=3.9"
keywords = ["llm", "ci", "testing", "reliability", "openai", "anthropic", "eval"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "click>=8.1",
  "pyyaml>=6.0",
  "jsonschema>=4.17",
  "openai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-asyncio>=0.21"]

[project.scripts]
flakegate = "flakegate.cli:main"

[project.urls]
Homepage = "https://github.com/sameermankotia/Flakegate"
Issues = "https://github.com/sameermankotia/Flakegate/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/flakegate"]
